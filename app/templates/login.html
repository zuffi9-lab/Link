{% extends 'base.html' %}
{% block title %}Вход в админку{% endblock %}
{% block content %}
<section class="card">
  <h1>Вход</h1>
  <form method="post" class="form-grid">
    <label>Логин
      <input type="text" name="username" required />
    </label>
    <label>Пароль
      <input type="password" name="password" required />
    </label>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}

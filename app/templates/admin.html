{% extends 'base.html' %}
{% block title %}Админка{% endblock %}
{% block content %}
<section class="card">
  <div class="row">
    <h1>Админка</h1>
    <a href="{{ url_for('admin_logout') }}">Выйти</a>
  </div>

  <h2>Добавить ссылку</h2>
  <form class="form-grid" method="post" action="{{ url_for('add_link') }}">
    <label>Название
      <input type="text" name="title" required />
    </label>
    <label>URL
      <input type="url" name="url" required />
    </label>
    <label>Описание
      <input type="text" name="description" />
    </label>
    <label>Порядок
      <input type="number" name="sort_order" value="0" />
    </label>
    <label class="checkbox">
      <input type="checkbox" name="is_active" checked /> Показывать публично
    </label>
    <button type="submit">Добавить</button>
  </form>

  <h2>Список ссылок</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Название</th><th>URL</th><th>Описание</th><th>Порядок</th><th>Активна</th><th>Действия</th></tr>
    </thead>
    <tbody>
      {% for link in links %}
      <tr>
        <td>{{ link['id'] }}</td>
        <td>
          <form class="inline-edit" method="post" action="{{ url_for('update_link', link_id=link['id']) }}">
            <input type="text" name="title" value="{{ link['title'] }}" required />
        </td>
        <td><input type="url" name="url" value="{{ link['url'] }}" required /></td>
        <td><input type="text" name="description" value="{{ link['description'] or '' }}" /></td>
        <td><input type="number" name="sort_order" value="{{ link['sort_order'] }}" /></td>
        <td>{{ 'Да' if link['is_active'] else 'Нет' }}</td>
        <td>
            <button type="submit">Сохранить</button>
          </form>
          <form style="display:inline" method="post" action="{{ url_for('toggle_link', link_id=link['id']) }}">
            <button type="submit">Переключить</button>
          </form>
          <form style="display:inline" method="post" action="{{ url_for('delete_link', link_id=link['id']) }}" onsubmit="return confirm('Удалить?')">
            <button type="submit">Удалить</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
